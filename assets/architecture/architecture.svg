<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-labelledby="t">
  <title id="t">OneStep の技術構成: 本番の処理（管理者 → Web App → Google Apps Script → Google Sheets）と、別枠の開発プロセス（Claude Code・GitHub・Obsidian）</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3b63"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b82"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#1f3b63; stroke-width:1.5; rx:8; }
    .box.g { fill:#eef4fb; }
    .box.dev { fill:#f6f7f9; stroke:#5b6b82; stroke-dasharray:5 4; }
    .lbl { fill:#0f2a4a; font-size:14px; font-weight:700; }
    .sub { fill:#4a5a70; font-size:12px; }
    .sec { fill:#1f3b63; font-size:15px; font-weight:700; }
    .sec.dev { fill:#5b6b82; }
    .ln { stroke:#1f3b63; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .ln.dev { stroke:#5b6b82; marker-end:url(#arr2); }
    .note { fill:#6b7a90; font-size:11px; }
  </style>

  <!-- 左: 本番の処理 -->
  <rect x="16" y="16" width="620" height="568" rx="12" fill="#fbfcfe" stroke="#d7e0ec"/>
  <text x="36" y="44" class="sec">本番の処理（クラブの運営で毎週動いているもの）</text>

  <!-- 利用者 -->
  <rect x="60" y="66" width="200" height="56" class="box"/>
  <text x="160" y="90" text-anchor="middle" class="lbl">管理者（スマホ）</text>
  <text x="160" y="108" text-anchor="middle" class="sub">Google ログイン</text>

  <rect x="380" y="66" width="200" height="56" class="box"/>
  <text x="480" y="90" text-anchor="middle" class="lbl">一般メンバー</text>
  <text x="480" y="108" text-anchor="middle" class="sub">合言葉・ログイン不要・読み取り専用</text>

  <!-- Web App -->
  <path d="M160 122 V160" class="ln"/>
  <path d="M480 122 V160" class="ln"/>
  <rect x="60" y="162" width="200" height="56" class="box"/>
  <text x="160" y="186" text-anchor="middle" class="lbl">OneStep Web App</text>
  <text x="160" y="204" text-anchor="middle" class="sub">管理者用（入力・集計・保守）</text>

  <rect x="380" y="162" width="200" height="56" class="box"/>
  <text x="480" y="186" text-anchor="middle" class="lbl">閲覧用ページ</text>
  <text x="480" y="204" text-anchor="middle" class="sub">同じ画面の閲覧用ビルド</text>

  <!-- GAS -->
  <path d="M160 218 V256" class="ln"/>
  <path d="M480 218 V256" class="ln"/>
  <rect x="60" y="258" width="520" height="62" class="box g"/>
  <text x="320" y="284" text-anchor="middle" class="lbl">Google Apps Script（サーバー）</text>
  <text x="320" y="304" text-anchor="middle" class="sub">権限の判定・変更履歴・集計・行の印（直接編集の検知）・再送の収束</text>

  <!-- Sheets 群 -->
  <path d="M120 320 V366" class="ln"/>
  <path d="M320 320 V366" class="ln"/>
  <path d="M520 320 V366" class="ln"/>

  <rect x="36" y="368" width="180" height="70" class="box"/>
  <text x="126" y="392" text-anchor="middle" class="lbl">Google Sheets（本体）</text>
  <text x="126" y="410" text-anchor="middle" class="sub">予定・出欠・記録・収支</text>
  <text x="126" y="426" text-anchor="middle" class="sub">会費・貸借・大会・設定</text>

  <rect x="230" y="368" width="180" height="70" class="box"/>
  <text x="320" y="392" text-anchor="middle" class="lbl">会員名簿（別ファイル）</text>
  <text x="320" y="410" text-anchor="middle" class="sub">本名・住所など。管理者限定</text>
  <text x="320" y="426" text-anchor="middle" class="sub">本体とは共有範囲を分ける</text>

  <rect x="424" y="368" width="180" height="70" class="box"/>
  <text x="514" y="392" text-anchor="middle" class="lbl">変更履歴 / Backup</text>
  <text x="514" y="410" text-anchor="middle" class="sub">誰がいつ何を変えたか</text>
  <text x="514" y="426" text-anchor="middle" class="sub">世代印つきの複製</text>

  <!-- Calendar / Drive -->
  <path d="M320 438 V478" class="ln"/>
  <rect x="120" y="480" width="180" height="56" class="box"/>
  <text x="210" y="504" text-anchor="middle" class="lbl">Google Calendar</text>
  <text x="210" y="522" text-anchor="middle" class="sub">大会の申込締切を登録</text>
  <rect x="340" y="480" width="180" height="56" class="box"/>
  <text x="430" y="504" text-anchor="middle" class="lbl">Google Drive</text>
  <text x="430" y="522" text-anchor="middle" class="sub">協会様式の複製・週次バックアップ</text>
  <path d="M320 478 H210 V480" class="ln"/>
  <path d="M320 478 H430 V480" class="ln"/>

  <text x="36" y="566" class="note">※ 本番の処理に AI は入っていません。すべて Google Apps Script と Google の各サービスで動きます。</text>

  <!-- 右: 開発プロセス（別枠） -->
  <rect x="656" y="16" width="288" height="568" rx="12" fill="#f9fafb" stroke="#cfd6df" stroke-dasharray="6 4"/>
  <text x="676" y="44" class="sec dev">開発プロセス（本番とは別枠）</text>

  <rect x="680" y="66" width="240" height="196" class="box dev"/>
  <text x="800" y="92" text-anchor="middle" class="lbl">Claude Code</text>
  <text x="700" y="120" class="sub">├ 要件整理（業務の棚卸し）</text>
  <text x="700" y="142" class="sub">├ 設計（提案書・自己レビュー）</text>
  <text x="700" y="164" class="sub">├ 実装</text>
  <text x="700" y="186" class="sub">├ テスト（自動テスト 496 件）</text>
  <text x="700" y="208" class="sub">└ Git 差分確認・本番反映前の確認</text>
  <text x="700" y="244" class="note">開発支援。本番の処理には接続しない</text>

  <path d="M800 262 V300" class="ln dev"/>
  <rect x="680" y="302" width="240" height="70" class="box dev"/>
  <text x="800" y="328" text-anchor="middle" class="lbl">GitHub（private）</text>
  <text x="800" y="348" text-anchor="middle" class="sub">ブランチ・レビュー・CI でテスト</text>
  <text x="800" y="364" text-anchor="middle" class="sub">clasp で Apps Script へ反映</text>

  <path d="M800 372 V410" class="ln dev"/>
  <rect x="680" y="412" width="240" height="70" class="box dev"/>
  <text x="800" y="438" text-anchor="middle" class="lbl">Obsidian</text>
  <text x="800" y="458" text-anchor="middle" class="sub">設計書・判断の記録・レビュー履歴</text>
  <text x="800" y="474" text-anchor="middle" class="sub">「なぜそう作ったか」を残す</text>

  <text x="680" y="530" class="note">設計 → 自己レビュー → GO → 実装 → テスト</text>
  <text x="680" y="548" class="note">→ Git 差分確認 → 本番反映前の確認 → 反映</text>
</svg>
